name: Atualização Diária dos Horários

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'   # mantenha aqui o seu agendamento atual

# Evita duas execuções simultâneas tentando dar push
concurrency:
  group: update-horarios
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Clonar o repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar dependências
        run: pip install -r utils/requirements.txt

      - name: 4. Criar arquivo de credenciais do Google
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > utils/service_account.json

      - name: 5. Executar script de atualização
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: python utils/main.py

      - name: 6. Commit e push (somente se os DADOS mudaram)
        run: |
          # Só olha os arquivos de dados. logs.txt NÃO entra aqui.
          if [ -z "$(git status --porcelain -- js/dados.js utils/Horarios_Salas_Combinados.csv)" ]; then
            echo "Nenhuma alteração nos horários. Nada a commitar."
            exit 0
          fi

          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add js/dados.js utils/Horarios_Salas_Combinados.csv
          git commit -m "Atualização automática dos horários"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push